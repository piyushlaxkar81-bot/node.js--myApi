<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users Management</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {
            background: #f5f7fb;
        }

        .user-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-avatar {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            background: #0d6efd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .username {
            font-size: 18px;
            font-weight: 600;
        }

        .email {
            color: #777;
            font-size: 14px;
        }

        label.error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        input.error {
            border-color: #dc3545;
        }

        input.valid {
            border-color: #198754;
        }

    </style>

</head>


<body>


    <!--NAVBAR-->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand">
                Users Management
            </span>

        </div>

    </nav>



    <!-- MAIN CONTAINER -->

    <div class="container py-5">


        <!-- HEADER -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1">
                    All Users
                </h2>

                <p class="text-muted mb-0">
                    Manage your users
                </p>

            </div>


            <!-- CREATE USER BUTTON -->

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#createUserModal"
            >
                + Create User
            </button>

        </div>



        <!-- ==========================================
             LOADER
        =========================================== -->

        <div
            id="loader"
            class="text-center py-5"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>

            <p class="mt-2 text-muted">
                Loading users...
            </p>

        </div>



        <!--USER CARDS-->

        <div
            id="user-card-container"
            class="row g-4"
        ></div>


    </div>



    <!-- ==========================================
         CREATE USER MODAL
    =========================================== -->

    <div
        class="modal fade"
        id="createUserModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div
            class="modal-dialog modal-dialog-centered"
        >

            <div class="modal-content">


                <!-- MODAL HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title">
                        Create New User
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>



                <!-- MODAL BODY -->

                <div class="modal-body">


                    <form id="create-user-form">


                        <!-- NAME -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label"
                            >
                                Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Enter name"
                            >

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter email"
                            >

                        </div>



                        <!-- SUBMIT BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create User
                        </button>


                    </form>


                </div>

            </div>

        </div>

    </div>




    <!-- ==========================================
         JAVASCRIPT LIBRARIES
    =========================================== -->


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
    ></script>



    <!-- jQuery Validation -->

    <script
        src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"
    ></script>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>



    <!-- Our JavaScript -->

    <script src="script.js"></script>


</body>

</html>
